networks:
  coltel_net:
    driver: bridge

name: coltel
services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - '6333:6333' # Qdrant HTTP port
      - '6334:6334' # Qdrant gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - coltel_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - .env
    networks:
      - coltel_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  coltel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.containers.internal:host-gateway"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --proxy-headers --port 8081    
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - coltel_net
    ports:
      - '80:8081'
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: >
      celery -A app.celery_tasks.worker:app worker --loglevel=info     
    volumes:
      - .:/app
    networks:
      - coltel_net
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      coltel-agent:
        condition: service_started
    restart: unless-stopped
 
volumes:
  qdrant_data:
  redis_data:
